[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 天気予報の取得と、自動配信モードの発動判定。
# 配信時刻は店舗が設定するためスケジュールで追えない。毎時起動して、
# その時刻が設定値と一致する時だけ配信する。
[functions."weather-check"]
  schedule = "0 * * * *"

# 全店舗の増分バックアップ。日本時間の深夜2時に実行。
# 運営自身の仕事(データ保全)なので、これだけはスケジュール実行で持つ。
[functions."backup"]
  schedule = "0 17 * * *"

# 2026-08-06: snapshot(基準日の残高記録)・deposit-expiry(預かり金の失効)・
# billing-status(引き落とし失敗/解約の日数判定)の3本を削除した。
# いずれも「日付から計算すれば分かること」を毎晩全店舗ぶん読んで
# 書き溜めていただけで、届出義務も失効も店舗↔お客様間の話。運営が
# 先回りして持つ必要がない。判定は必要になった時点(画面表示・決済時)に
# その場で計算する。
