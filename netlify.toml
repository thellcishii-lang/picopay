[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 基準日(3/31・9/30)の残高を記録する定期実行。
# Netlify は UTC なので 15:00 UTC = 翌 00:00 JST。毎日起動して、
# 前日が基準日だった時だけ記録する。
[functions."snapshot"]
  schedule = "0 15 * * *"

# 天気予報の取得と、自動配信モードの発動判定。
# 配信時刻は店舗が設定するためスケジュールで追えない。毎時起動して、
# その時刻が設定値と一致する時だけ配信する。
[functions."weather-check"]
  schedule = "0 * * * *"

# 全店舗の増分バックアップ。日本時間の深夜2時に実行。
[functions."backup"]
  schedule = "0 17 * * *"

# 引き落とし失敗・解約のタイムライン判定(25日/30日/60日)。
# 日本時間の深夜3時に実行。
[functions."billing-status"]
  schedule = "0 18 * * *"
